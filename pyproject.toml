[project]
name = "easyhoudini-mcp"
dynamic = ["version"]
description = "A Houdini MCP that builds readable node graphs, follows studio USD practice, records a timelapse and asks before it goes on. For Claude, Codex, Cursor and other AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rodion Zhabrev" }, { name = "John Chedeville" }]
keywords = ["houdini", "sidefx", "mcp", "model-context-protocol", "mcp-server", "claude", "codex", "cursor", "ai-agent", "usd", "solaris", "karma", "vfx", "procedural", "3d"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp[cli]>=2.2",
    "houdinimd-docs>=0.1",
]

# The repository URL lives here. Everything that needs it reads it from here,
# except the bootstrap scripts, which run before the repository exists, and
# bridge/update.py, which runs from a wheel that has no pyproject.toml.
[project.urls]
Repository = "https://github.com/rozhabrev/easyhoudini_mcp"
Issues = "https://github.com/rozhabrev/easyhoudini_mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/houdinimcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/houdinimcp", "src/bridge"]

[tool.hatch.build.targets.sdist]
include = ["src", "houdini_mcp_server.py", "README.md",
           "LICENSE", "AGENTS.md", "agents", "bootstrap.sh", "bootstrap.bat"]

[project.scripts]
houdinimcp-bridge = "bridge.cli:main"
houdinimcp-install = "bridge.onboarding.install:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
